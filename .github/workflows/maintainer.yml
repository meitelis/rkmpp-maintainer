name: RKMPP maintainer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: maintainer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Unit tests, syntax and Compose validation
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile *.py
          docker compose config --quiet
          docker compose -f portainer-stack.yml config --quiet
          bash -n scripts/migrate-to-portainer.sh
  smoke:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the tested controller
        run: docker compose build maintainer
      - name: Actual PHP failure propagation, broken-source rejection and Docker timeout cleanup
        run: docker compose run --rm maintainer runtime-check
      - name: Real ARM64 local-model edit, tests, build and export
        run: docker compose run --rm maintainer smoke
      - name: Real Go startup integration repair and complete Memories candidate checks
        run: docker compose run --rm --entrypoint python3 maintainer /opt/maintainer/repair_check.py
      - name: Logs and stop isolated daemon
        if: always()
        run: |
          docker compose logs --no-color --tail=100
          sudo find data/jobs -name result.json -exec cat {} \; 2>/dev/null || true
          sudo find data/jobs -name agent.jsonl -exec tail -n 15 {} \; 2>/dev/null || true
          sudo tail -n 100 data/model.log 2>/dev/null || true
          docker compose down --volumes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintainer-qualification-evidence
          retention-days: 7
          path: |
            data/jobs/**/result.json
            data/jobs/**/run-manifest.json
            data/jobs/**/agent.jsonl
            data/jobs/**/agent-review.json
            data/jobs/**/error.txt
            data/jobs/**/*.log
            data/model.log
            data/cleanup-errors.jsonl
