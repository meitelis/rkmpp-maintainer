# Deploy this file from Portainer, using stack name rkmpp-maintainer.
# Build the local maintainer image on the Radxa before deploying.
services:
  builder:
    image: docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
    privileged: true
    # Keep 1 GiB above the measured Q4 CPU coding model's 18 GiB cap
    # for the nested daemon. Host admission separately reserves 1 GiB.
    mem_limit: 19g
    memswap_limit: 19g
    cpus: 6
    cpu_shares: 128
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--label=rkmpp.maintainer=isolated", "--storage-driver=${DIND_STORAGE_DRIVER:-overlay2}"]
    # Expose RK3588 media devices to this isolated daemon so it can validate
    # hardware on the actual board before exporting any deployable candidate.
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/mali0:/dev/mali0
    volumes:
      - type: bind
        source: /armbian/rkmpp-maintainer/builder
        target: /var/lib/docker
        bind:
          create_host_path: false
      - type: bind
        source: /armbian/rkmpp-maintainer/data
        target: /workspace
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [maintainer]
  maintainer:
    image: local/rkmpp-maintainer:pr10
    pull_policy: never
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      builder:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://builder:2375
      DOCKER_TLS_CERTDIR: ""
      # Fail closed until a real full upgrade and isolation test is qualified.
      # With false, the controller makes NO release polling requests.
      AUTO_UPDATE: ${AUTO_UPDATE:-false}
      # Independent opt-in: publish only fully hardware-qualified candidates.
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      # A fine-grained token scoped to only the two fork repositories.
      # Never pass this token to builder/model/verification containers.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-}
      # Optional diagnostic model choice; default coding = CPU-only Q4 16K.
      # Existing hybrids were slower on-board and must not run unattended.
      MODEL_PROFILE: ${MODEL_PROFILE:-}
    # The Memories on-board matrix enumerates /dev nodes in the controller.
    # Hardware is exercised only inside the isolated Docker builder.
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/mali0:/dev/mali0
    # With AUTO_UPDATE=true, align candidate discovery with Dublin midnight.
    # Otherwise watch is idle; use MAINTAINER_ACTION=idle for manual jobs.
    command: ["${MAINTAINER_ACTION:-watch}"]
    volumes:
      - type: bind
        source: /armbian/rkmpp-maintainer/data
        target: /workspace
        bind:
          create_host_path: false
    networks: [maintainer]
  # One supervised worker, opted into separately from upstream release updates.
  qualifier:
    image: local/rkmpp-maintainer:pr10
    pull_policy: never
    init: true
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      builder:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://builder:2375
      DOCKER_TLS_CERTDIR: ""
      QUALIFICATION_ENABLED: ${QUALIFICATION_ENABLED:-false}
    entrypoint: ["python3", "/opt/maintainer/qualification_queue.py"]
    command: ["--serve", "--model-profile", "coding"]
    # Hardware is tested only through the separate inner daemon; no token.
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/mali0:/dev/mali0
    volumes:
      - type: bind
        source: /armbian/rkmpp-maintainer/data
        target: /workspace
        bind:
          create_host_path: false
    networks: [maintainer]
networks:
  maintainer:
